# セレスティア — 通知の時刻が来た予定を送らせる係。
#
# Supabase の関数（send-pings）を叩くだけ。中の判断は全部あちらがやる。
#
# ふだんは動かない。Supabase 側の cron（毎分）が本番で、こちらは予備。
# 使うときは下の schedule の行の # を外す。そうすると5分おきに動きだす。
# 手で1回だけ走らせたいときは、GitHub の Actions タブ →「send-pings」→ Run workflow。

name: send-pings

on:
  # schedule:
  #   - cron: "*/5 * * * *"   # 5分おき（GitHub の都合で数分ずれることがある）
  workflow_dispatch:          # いまは手で走らせるときだけ

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      # 合言葉が要る。GitHub の Settings → Secrets and variables → Actions で
      # CRON_SECRET という名前で、Supabase 側に入れたのと同じ文字を登録しておくこと。
      # 登録せずに動かすと 401 で断られる。
      - name: 時刻が来た予定を送らせる
        run: |
          curl -sS -m 60 -X POST \
            "https://dtxrdhtseahscofxpzfh.supabase.co/functions/v1/send-pings" \
            -H "x-celestia-key: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
          echo
